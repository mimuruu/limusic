org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# The project lives on D: while the Gradle and pub caches stay on C:. Kotlin's incremental
# compilation keeps memory-mapped .tab files under build/ and, across that split, the daemon
# intermittently fails to close them ("Could not close incremental caches"). Disabling it costs a
# full recompile of this app's two small plugins per build and removes the failure entirely.
kotlin.incremental=false
kotlin.incremental.android=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
